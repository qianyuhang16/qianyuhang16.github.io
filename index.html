<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yuhang Qian, Fudan University">
    <meta name="theme-color" content="#0a0c0f">
    <title>Yuhang Qian</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #0a0c0f;
            --surface: #101419;
            --surface-raised: #151a20;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #7ee787;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100svh;
            padding: 24px;
            overflow-x: hidden;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 10%, rgb(126 231 135 / 7%), transparent 32rem),
                radial-gradient(circle at 85% 90%, rgb(88 166 255 / 6%), transparent 30rem),
                var(--background);
            font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        }

        .terminal {
            flex: 0 1 760px;
            width: 100%;
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgb(16 20 25 / 94%);
            box-shadow:
                0 26px 80px rgb(0 0 0 / 45%),
                0 0 0 1px rgb(255 255 255 / 2%) inset;
        }

        .title-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-raised);
        }

        .window-controls {
            display: flex;
            gap: 7px;
            flex: 0 0 auto;
        }

        .window-controls span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #484f58;
        }

        .window-controls span:first-child {
            background: #ff7b72;
        }

        .window-controls span:nth-child(2) {
            background: #d29922;
        }

        .window-controls span:last-child {
            background: #3fb950;
        }

        .path {
            min-width: 0;
            overflow: hidden;
            color: var(--muted);
            font-size: 0.78rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .terminal-body {
            padding: clamp(34px, 8vw, 72px) clamp(24px, 8vw, 68px);
        }

        .command {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: clamp(0.82rem, 2.5vw, 0.95rem);
        }

        .prompt {
            margin-right: 8px;
            color: var(--accent);
            font-weight: 700;
        }

        h1 {
            margin: 0;
            color: #f0f6fc;
            font-size: clamp(2rem, 7vw, 3.25rem);
            font-weight: 650;
            letter-spacing: -0.045em;
            line-height: 1.1;
        }

        .school {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: clamp(0.95rem, 3vw, 1.08rem);
        }

        .contact {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px;
            margin: clamp(54px, 10vw, 86px) 0 0;
            font-size: clamp(0.88rem, 3vw, 1rem);
            line-height: 1.7;
        }

        .contact-label {
            color: var(--muted);
        }

        a {
            color: var(--accent);
            overflow-wrap: anywhere;
            text-decoration-color: rgb(126 231 135 / 45%);
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
        }

        a:hover {
            text-decoration-color: currentColor;
        }

        a:focus-visible {
            border-radius: 2px;
            outline: 2px solid var(--accent);
            outline-offset: 5px;
        }

        .cursor {
            display: inline-block;
            width: 0.6em;
            height: 1.1em;
            margin-top: 28px;
            background: var(--accent);
            vertical-align: text-bottom;
            animation: blink 1.1s steps(1, end) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 14px;
            }

            .terminal {
                border-radius: 9px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main class="terminal">
        <header class="title-bar" aria-hidden="true">
            <div class="window-controls">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="path">~/profile</div>
        </header>

        <section class="terminal-body" aria-labelledby="name">
            <p class="command"><span class="prompt">$</span>whoami</p>
            <h1 id="name">Yuhang Qian</h1>
            <p class="school">Fudan University</p>

            <p class="contact">
                <span class="prompt">$</span>
                <span class="contact-label">mail</span>
                <a href="mailto:qianyuhang16@gmail.com">qianyuhang16@gmail.com</a>
            </p>
            <span class="cursor" aria-hidden="true"></span>
        </section>
    </main>
</body>
</html>
